name: Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Restore dependencies
        uses: actions/cache/restore@v6.1.0
        id: dependencies
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Save dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

  checks:
    name: ${{ matrix.check }}
    runs-on: self-hosted
    needs: setup
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dartscounter_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d dartscounter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v4
      - name: Restore dependencies
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check test database connection
        if: matrix.check == 'test'
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          database_host=127.0.0.1
          database_port="$POSTGRES_PORT"
          if [ -f /.dockerenv ]; then
            # Attach the disposable service to the Coolify runner's network, leaving the runner unchanged.
            runner_network="$(docker inspect --format '{{range $name, $network := .NetworkSettings.Networks}}{{$name}}{{"\n"}}{{end}}' "$HOSTNAME" | head -n 1)"
            if [ "$runner_network" != host ]; then
              docker network connect "$runner_network" "$POSTGRES_CONTAINER"
              database_host="$(docker inspect --format "{{(index .NetworkSettings.Networks \"$runner_network\").IPAddress}}" "$POSTGRES_CONTAINER")"
              database_port=5432
            fi
          fi
          export TEST_DATABASE_URL="postgresql://postgres:postgres@${database_host}:${database_port}/dartscounter_test"
          bun -e 'import { Pool } from "pg"; const pool = new Pool({ connectionString: process.env.TEST_DATABASE_URL, connectionTimeoutMillis: 5000 }); try { await pool.query("SELECT 1") } finally { await pool.end() }'
          printf 'TEST_DATABASE_URL=%s\n' "$TEST_DATABASE_URL" >> "$GITHUB_ENV"
      - name: Get Playwright version
        if: matrix.check == 'test'
        id: playwright
        run: bun -e "console.log('version=' + require('playwright-core/package.json').version)" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        if: matrix.check == 'test'
        uses: actions/cache/restore@v6.1.0
        id: chromium
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # System libraries are outside the browser cache and must be checked on every run.
      - name: Install Chromium with system dependencies
        if: matrix.check == 'test'
        run: bunx --bun playwright-core install --with-deps chromium
      - name: Save Chromium
        if: matrix.check == 'test' && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Run ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  build-docker-image:
    runs-on: self-hosted
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: Dockerfile
